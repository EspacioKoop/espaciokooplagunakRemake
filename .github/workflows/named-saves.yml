name: Verify named campaign saves
on:
  pull_request:
    paths:
      - 'game/**'
      - 'tests/*named_save*'
      - 'tests/run_named_saves.py'
      - '.github/workflows/named-saves.yml'
      - 'tools/bootstrap.py'
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: named-saves-${{ github.ref }}
  cancel-in-progress: true
jobs:
  named-saves:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -p test_named_save_runner.py -v
      - run: sudo apt-get update -qq && sudo apt-get install -y xvfb libgl1-mesa-dri
      - run: python3 tools/bootstrap.py
      - name: Import in an isolated profile
        run: |
          mkdir -p build/named-import-profile
          HOME="$PWD/build/named-import-profile" XDG_DATA_HOME="$PWD/build/named-import-profile/data" XDG_CONFIG_HOME="$PWD/build/named-import-profile/config" .toolchain/godot --headless --editor --path game --quit
      - run: python3 tests/run_named_saves.py --graphical
      - name: Preserve both native storage migration regressions
        run: |
          python3 tests/run_storage_properties.py --seed 3204301 --samples 64
          python3 tests/run_storage_properties.py --seed 641709 --samples 64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: named-saves-evidence
          path: build/named-saves/
          if-no-files-found: warn
          retention-days: 14
