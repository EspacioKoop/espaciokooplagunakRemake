name: Verify keyboard and controller input

on:
  pull_request:
    paths:
      - 'game/**'
      - 'tests/test_input*.gd'
      - 'tests/run_input_controls.py'
      - 'tools/bootstrap.py'
      - '.github/workflows/input-controls.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: input-controls-${{ github.ref }}
  cancel-in-progress: true

jobs:
  controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install virtual display for captured mouse and gamepad walking
        run: sudo apt-get update -qq && sudo apt-get install -y xvfb libgl1-mesa-dri
      - name: Download verified engine
        run: python3 tools/bootstrap.py
      - name: Import resources
        run: .toolchain/godot --headless --editor --path game --quit
      - name: Validate profiles, live remapping, controller menus and physical walking
        run: python3 tests/run_input_controls.py --graphical --screenshot build/input-controls.png
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: input-controls-panel
          path: build/input-controls.png
          if-no-files-found: warn
          retention-days: 14
