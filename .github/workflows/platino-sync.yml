name: Apply separately reviewed milestones (temporary)

on:
  push:
    branches: [agent/72-platino-adoption]
    paths: [.github/workflows/platino-sync.yml]

permissions:
  contents: read
  issues: write

concurrency:
  group: platino-milestones
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  apply:
    if: github.repository == 'EspacioKoop/espaciokooplagunakRemake' && github.ref == 'refs/heads/agent/72-platino-adoption'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 1195c2575e8ee77c6108a4684679944026f0c1e0
          persist-credentials: false
      - name: Verify immutable reviewed sources and reconciled plan
        run: |
          test "$(git rev-parse HEAD)" = 1195c2575e8ee77c6108a4684679944026f0c1e0
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json
          lock = json.loads(Path('docs/platino/upstream-lock.json').read_text())
          assert lock['commit'] == 'b5e01a2b2060a31268507797708a92a7d14ffc52'
          for item in lock['files']:
              raw = (Path('docs/platino/upstream') / item['path']).read_bytes()
              assert hashlib.sha256(raw).hexdigest() == item['sha256']
          assert hashlib.sha256(Path('docs/platino/upstream/scripts/platino.py').read_bytes()).hexdigest() == '62c9ea38a39d8bd7f994a1695f0e38ab2e7e0a3ef06cf1efba179034945f91b9'
          assert hashlib.sha256(Path('.platino.json').read_bytes()).hexdigest() == '86fb4b9b1c6cbf0e5e73da82275bb50053e339ae44be89a33ee0aa2a81014b9c'
          PY
          python3 -m unittest discover -s docs/platino/upstream/tests -v
          python3 tools/platino.py check .platino.json
      - name: Apply only the five actions approved independently in issue 72 comment 5638604229
        env:
          GH_TOKEN: ${{ github.token }}
          GH_DEBUG: ''
        run: |
          mkdir -p "$RUNNER_TEMP/platino-applied"
          python3 tools/platino.py sync .platino.json --repo EspacioKoop/espaciokooplagunakRemake --apply --approve adc786ebef18aea2f1612e41b75816fd3836227791825f835daed9692481fee9 > "$RUNNER_TEMP/platino-applied/applied.json"
          python3 tools/platino.py sync .platino.json --repo EspacioKoop/espaciokooplagunakRemake > "$RUNNER_TEMP/platino-applied/after.json"
          python3 - <<'PY'
          from pathlib import Path
          import json, os
          after = json.loads((Path(os.environ['RUNNER_TEMP']) / 'platino-applied/after.json').read_text())
          assert after['actions'] == [], 'Post-apply plan is not empty'
          print('Verified: no remaining milestone actions. No game or release changes.')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: platino-applied-72
          path: ${{ runner.temp }}/platino-applied/
          retention-days: 7
          if-no-files-found: warn
