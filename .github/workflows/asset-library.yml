name: Visual 3D asset library

on:
  push:
    branches: [agent/52-visual-library]
    paths:
      - 'tools/asset_library/**'
      - 'tests/asset_library/**'
      - 'docs/asset_library/CONTRIBUTING.md'
      - 'docs/asset_library/schema.json'
      - '.github/workflows/asset-library.yml'
  pull_request:
    paths:
      - 'tools/asset_library/**'
      - 'tests/asset_library/**'
      - 'docs/ASSET_LIBRARY.md'
      - 'docs/asset_library.json'
      - 'docs/asset_library/**'
      - 'docs/images/asset_library/**'
      - '.github/workflows/asset-library.yml'

concurrency:
  group: visual-library-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  catalogue:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install catalogue validation dependencies
        run: python -m pip install 'Pillow==11.3.0' 'jsonschema==4.25.1'
      - name: Install Blender only for deliberate catalogue refresh
        if: github.event_name == 'push'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libegl1 libxi6 libxrender1 libxfixes3 libxxf86vm1
          python -m pip install 'bpy==4.5.3'
      - name: Unit regressions
        run: |
          mkdir -p build/asset_library
          python -m compileall -q tools/asset_library tests/asset_library
          python -m unittest discover -s tests/asset_library -v 2>&1 | tee build/asset_library/unit.log
      - name: Preserve the historical v1 index before generating v2
        if: github.event_name == 'push'
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess, re, posixpath
          out=Path('docs/asset_library');out.mkdir(parents=True,exist_ok=True)
          commit=subprocess.check_output(['git','rev-parse','origin/main'],text=True).strip()
          for old,new in [('docs/asset_library.json','legacy.v1.json'),('docs/ASSET_LIBRARY.md','LEGACY_INDEX.md')]:
              target=out/new
              if target.exists():continue
              text=subprocess.check_output(['git','show',commit+':'+old],text=True)
              if old.endswith('.md'):
                  def absolute(match):
                      label,target=match.groups()
                      if target.startswith(('https://','http://','#')):return match.group(0)
                      path=posixpath.normpath('docs/'+target)
                      return label+'(https://github.com/EspacioKoop/espaciokooplagunakRemake/blob/'+commit+'/'+path+')'
                  text=re.sub(r'(\[[^\]]*\])\(([^)]+)\)',absolute,text)
                  text='# Archivo histórico del índice v1\n\nCopia de `'+commit+'`. No describe el estado actual; [abrir biblioteca visual](../ASSET_LIBRARY.md). Los enlaces relativos se han fijado a la revisión original.\n\n'+text
              target.write_text(text,encoding='utf-8')
          PY
      - name: Build cards and missing individual photographs from immutable Git blobs
        if: github.event_name == 'push'
        run: python -u tools/asset_library/catalogue.py --refresh --render-missing 2>&1 | tee build/asset_library/generate.log
      - name: Reproduce committed catalogue without rebuilding any model
        run: python -u tools/asset_library/catalogue.py --check 2>&1 | tee build/asset_library/reproduce.log
      - name: Check schema every photo and all local links
        run: python tools/asset_library/validate_output.py 2>&1 | tee build/asset_library/output.log
      - name: Package catalogue evidence
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile
          root=Path.cwd();out=root/'build/asset_library';out.mkdir(parents=True,exist_ok=True)
          with zipfile.ZipFile(out/'Biblioteca_visual_3D.zip','w',zipfile.ZIP_DEFLATED) as z:
              for folder in ['docs/asset_library','docs/images/asset_library','tools/asset_library','tests/asset_library']:
                  for file in sorted((root/folder).rglob('*')):
                      if file.is_file() and '__pycache__' not in file.parts and file.suffix!='.pyc':z.write(file,file.relative_to(root))
              for file in [root/'docs/ASSET_LIBRARY.md',root/'docs/asset_library.json',*out.glob('*.json'),*out.glob('*.log')]:
                  if file.is_file():z.write(file,file.relative_to(root))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: visual-asset-library-evidence
          path: |
            build/asset_library/*.log
            build/asset_library/*.json
            build/asset_library/Biblioteca_visual_3D.zip
          retention-days: 14
          if-no-files-found: error
      - name: Preserve verified documentation only on the reserved catalogue branch
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/agent/52-visual-library'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" fetch origin agent/52-visual-library
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/agent/52-visual-library)" ]; then
            echo 'Catalogue inputs changed during validation; refusing stale publication'; exit 1
          fi
          git add -- docs/ASSET_LIBRARY.md docs/asset_library.json docs/asset_library docs/images/asset_library
          if git diff --cached --quiet; then exit 0; fi
          python - <<'PY'
          import subprocess
          for path in subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines():
              allowed=path in {'docs/ASSET_LIBRARY.md','docs/asset_library.json'} or path.startswith(('docs/asset_library/','docs/images/asset_library/'))
              if not allowed:raise SystemExit('Refusing non-catalogue write '+path)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(assets): publish verified individual photos cards and structured catalogue'
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/agent/52-visual-library
