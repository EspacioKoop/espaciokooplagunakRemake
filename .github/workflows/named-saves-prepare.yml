name: Preserve verified named campaign saves
on:
  push:
    branches: [agent/32-named-saves-s7]
    paths: [.github/workflows/named-saves-prepare.yml]
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'EspacioKoop/espaciokooplagunakRemake' && github.ref == 'refs/heads/agent/32-named-saves-s7'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - name: Restore exact public sources within the reserved scope
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess, urllib.request, zlib
          root = pathlib.Path.cwd()
          blobs = ['7e090c2cab9cb6e4d92d21745f7af6b552a61252', 'a2e4e498e019e002d5d75d1ce61fba82361ce5a7', '84b139d87daebb030c21f27145a58ee28f420e5e', '107c712cae30797523367ea4f2b157ca49d26a18']
          chunks = []
          for index, sha in enumerate(blobs):
              url = 'https://api.github.com/repos/EspacioKoop/espaciokooplagunakRemake/git/blobs/' + sha
              request = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  envelope = json.loads(response.read(50000))
              chunk = base64.b64decode(envelope['content'])
              assert hashlib.sha1(('blob %d\0' % len(chunk)).encode() + chunk).hexdigest() == sha
              if index == 0:
                  # Correct the proven duplicate/padding transcription in transport only.
                  # The corrected Git hash and the full payload hash were verified locally.
                  encoded = base64.b64encode(chunk).decode().replace('PR09H6082myR6082myR96', 'PR09H6082myR96').rstrip('=')
                  encoded = encoded[:-1] + 'q'
                  chunk = base64.b64decode(encoded, validate=True)
                  assert hashlib.sha1(('blob %d\0' % len(chunk)).encode() + chunk).hexdigest() == '591625137fec227fe9e2b3e01260fc42121922aa'
              chunks.append(chunk)
          decoder = zlib.decompressobj()
          raw = decoder.decompress(b''.join(chunks), 1000000)
          assert decoder.eof and not decoder.unconsumed_tail and not decoder.unused_data
          assert hashlib.sha256(raw).hexdigest() == 'cda51e13fbdc62317dea5cd20a1616826c19aca2ec24b4507bdf8918becfc6e3'
          payload = json.loads(raw)
          hot = {'game/core/storage.gd', 'game/core/expedition_systems.gd', 'game/net/session.gd', 'game/ui/app.gd'}
          new = {'game/core/campaign_checkpoint.gd', 'game/core/named_save_store.gd', 'game/ui/named_save_window.gd'}
          new |= {path + '.uid' for path in list(new)}
          new |= {'tests/test_named_save.gd', 'tests/run_named_saves.py', 'tests/test_named_save_runner.py', 'docs/NAMED_SAVES.md', '.github/workflows/named-saves.yml'}
          assert set(payload['base']) == hot and set(payload['new']) == new and set(payload['sha256']) == hot | new
          for path, sha in payload['base'].items():
              assert subprocess.check_output(['git', 'hash-object', path], text=True).strip() == sha, path
          subprocess.run(['git', 'apply', '--check', '-'], input=payload['patch'], text=True, check=True)
          subprocess.run(['git', 'apply', '-'], input=payload['patch'], text=True, check=True)
          for path, text in payload['new'].items():
              target = root / path
              assert not target.exists(), path
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(text, encoding='utf-8')
          for path, sha in payload['sha256'].items():
              assert hashlib.sha256((root / path).read_bytes()).hexdigest() == sha, path
          (root / 'build').mkdir(exist_ok=True)
          (root / 'build/named-source-hashes.json').write_text(json.dumps(payload['sha256']))
          subprocess.run(['git', 'diff', '--check'], check=True)
          print('All 15 reserved text files match the locally tested source hashes.')
          PY
      - run: sudo apt-get update -qq && sudo apt-get install -y xvfb libgl1-mesa-dri
      - run: python3 tools/bootstrap.py
      - name: Import with isolated writable profile
        run: |
          mkdir -p build/named-import-profile
          HOME="$PWD/build/named-import-profile" XDG_DATA_HOME="$PWD/build/named-import-profile/data" XDG_CONFIG_HOME="$PWD/build/named-import-profile/config" .toolchain/godot --headless --editor --path game --quit
      - run: python3 -m unittest discover -s tests -p test_named_save_runner.py -v
      - run: python3 tests/run_named_saves.py --graphical
      - name: Preserve both native migration regressions
        run: |
          python3 tests/run_storage_properties.py --seed 3204301 --samples 64
          python3 tests/run_storage_properties.py --seed 641709 --samples 64
      - name: Commit verified sources and photograph to this branch only
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, shutil, subprocess, sys
          root = pathlib.Path.cwd()
          hashes = json.loads((root / 'build/named-source-hashes.json').read_text())
          for path, sha in hashes.items():
              assert hashlib.sha256((root / path).read_bytes()).hexdigest() == sha, path
          sys.path.insert(0, str(root / 'tests'))
          from run_named_saves import verify_png
          report = json.loads((root / 'build/named-saves/report.json').read_text())
          assert report['passed'] is True
          assert report['checks_by_process'] == {'headless-main': 243, 'headless-restart': 6, 'graphical-main': 244, 'graphical-restart': 6}
          image = root / 'build/named-saves/named-saves.png'
          assert verify_png(image) == report['screenshot']
          for path, sha in report['sources'].items():
              assert sha == hashes[path], path
          screenshot = 'docs/images/named-saves.png'
          shutil.copyfile(image, root / screenshot)
          temporary = '.github/workflows/named-saves-prepare.yml'
          subprocess.run(['git', 'add', '--', *sorted(hashes), screenshot], check=True)
          subprocess.run(['git', 'rm', '--', temporary], check=True)
          staged = subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines()
          assert set(staged) == set(hashes) | {screenshot, temporary}, staged
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'commit', '-m', 'feat(saves): named local campaign checkpoints with recovery and verified UI'], check=True)
          branch = 'refs/heads/agent/32-named-saves-s7'
          remote = subprocess.check_output(['git', 'ls-remote', 'origin', branch], text=True).split()[0]
          assert remote == os.environ['EXPECTED_HEAD'], 'Branch advanced; refusing to overwrite concurrent work'
          subprocess.run(['git', 'push', 'origin', 'HEAD:' + branch], check=True)
          print('Published tested sources and real screenshot; temporary publisher removed.')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: named-saves-integration-evidence
          path: build/named-saves/
          if-no-files-found: warn
          retention-days: 14
