name: Apply verified 0.9.2 preparation patch
on:
  push:
    branches: [agent/67-release-092]
    paths: [.github/workflows/release-092-prepare.yml]
permissions:
  contents: read
concurrency:
  group: release-092-prepare
  cancel-in-progress: false
jobs:
  apply:
    if: github.ref == 'refs/heads/agent/67-release-092'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify and apply exact local patch to reserved release files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,hashlib,zlib,subprocess
          from pathlib import Path
          encoded = '''
          
          
          
          
          '''
          raw=zlib.decompress(base64.b64decode(encoded))
          assert len(raw)==44572
          assert hashlib.sha256(raw).hexdigest()=='82a04f9ec17bdd188123293ac333c85eb7bff687f91cd89ca2572e5e97cb5b9e'
          patch=Path('/tmp/release092.patch');patch.write_bytes(raw)
          subprocess.run(['git','apply','--check','--index',str(patch)],check=True)
          subprocess.run(['git','apply','--index',str(patch)],check=True)
          allowed={'.github/workflows/release.yml','README.md','docs/RELEASE_0_9_2.md','docs/RELEASE_NOTES.md','game/export_presets.cfg','game/project.godot','integrations/foundry/module.json','tests/release_092/run.py','tests/release_092/test_export_contract.gd','tests/release_092/test_runner.py','tests/test_publish_release.py','tools/export_targets.py','tools/publish_release.py'}
          changed=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          assert changed==allowed,changed
          subprocess.run(['git','diff','--cached','--check'],check=True)
          print('VERIFIED_RELEASE_PATCH',len(changed),hashlib.sha256(raw).hexdigest())
          PY
          python3 -m unittest discover -s tests -p test_publish_release.py -v
          python3 -m unittest discover -s tests/release_092 -p test_runner.py -v
          git rm .github/workflows/release-092-prepare.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'release: prepare 0.9.2 and verify the downloaded Linux executable'
      - name: Preserve tested preparation only on the reserved branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/agent/67-release-092
          git rev-parse HEAD
