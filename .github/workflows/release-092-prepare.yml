name: Prepare embedded 0.9.2 acceptance
on:
  push:
    branches: [agent/67-release-092]
    paths: [.github/workflows/release-092-prepare.yml]
permissions:
  contents: read
concurrency:
  group: release-092-prepare
  cancel-in-progress: false
jobs:
  apply:
    if: github.ref == 'refs/heads/agent/67-release-092'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Apply hash-checked fix and preserve unmodified test assertions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,hashlib,zlib,subprocess
          from pathlib import Path
          encoded=''''''
          raw=zlib.decompress(base64.b64decode(encoded))
          assert len(raw)==24500
          assert hashlib.sha256(raw).hexdigest()=='46cdfddc55032a3f1774d812023a8280299975b648ac9d8c7cdcbc2b4b6d4ed2'
          patch=Path('/tmp/embedded092.patch');patch.write_bytes(raw)
          subprocess.run(['git','apply','--check','--index',str(patch)],check=True)
          subprocess.run(['git','apply','--index',str(patch)],check=True)
          PY
          python3 tests/release_092/prepare.py
          python3 tests/release_092/prepare.py --check
          python3 -m unittest discover -s tests/release_092 -p test_runner.py -v
          python3 -m unittest discover -s tests -p test_publish_release.py -v
          git add game/release_acceptance/fixtures/*.gd game/data/release_acceptance_sources.json
          python3 - <<'PY'
          import subprocess
          allowed={'docs/RELEASE_0_9_2.md','docs/RELEASE_NOTES.md','game/project.godot','game/ui/app.gd','tests/release_092/prepare.py','tests/release_092/run.py','tests/release_092/test_runner.py','tests/release_092/test_dispatch.py','tests/release_092/test_export_contract.gd','game/release_acceptance/dispatch.gd','game/release_acceptance/fixtures/test_export_contract.gd','game/release_acceptance/fixtures/test_terminal_transition.gd','game/release_acceptance/fixtures/test_leisure.gd','game/release_acceptance/fixtures/test_ship_corridors.gd','game/release_acceptance/fixtures/test_ship_deck_layout.gd','game/data/release_acceptance_sources.json'}
          assert set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())==allowed
          subprocess.run(['git','diff','--cached','--check'],check=True)
          PY
          git rm .github/workflows/release-092-prepare.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(release): execute fixed embedded acceptance on official exports'
      - name: Preserve correction exclusively on the candidate branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/agent/67-release-092
          git rev-parse HEAD
