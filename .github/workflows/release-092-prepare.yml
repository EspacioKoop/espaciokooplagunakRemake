name: Prepare isolated 0.9.2 candidate
on:
  push:
    branches: [agent/67-release-092]
    paths: [.github/workflows/release-092-prepare.yml]
permissions:
  contents: read
concurrency:
  group: release-092-prepare
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/agent/67-release-092'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Stage reviewed and pending-review deliveries without touching their branches
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c release-092-staging
          for entry in '64 921c2ff4478e3eca2c6d9175d2aa5602fe8083c7' '57 cae594662d17157b296b6d4c79a881b666093ee1' '60 5d840fd391687265d75d1cbd1c12ce433531cf6f' '61 967bd26e6b1f0b4c10183e7a9051c19f5ef57674'; do
            read -r number revision <<< "$entry"
            git cat-file -e "$revision^{commit}"
            git merge --no-ff --no-edit -m "chore(release): stage PR #$number for combined 0.9.2 validation" "$revision"
          done
          git rm .github/workflows/release-092-prepare.yml
          git commit -m 'chore(release): remove temporary candidate preparation workflow'
          mkdir -p build/release-092-preparation
          git rev-parse HEAD > build/release-092-preparation/commit.txt
          git log -6 --format='%H %P %s' > build/release-092-preparation/parents.txt
          git diff --stat 995032807d10b29322eb9ea9551521cdd401034b HEAD > build/release-092-preparation/changes.txt
          git archive --format=tar.gz -o build/release-092-preparation/source.tar.gz HEAD
      - name: Preserve the candidate only on its own branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/agent/67-release-092
      - name: Obtain verified engine for independent local tests
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/bootstrap.py
          cp .toolchain/godot build/release-092-preparation/godot
          sha256sum build/release-092-preparation/source.tar.gz build/release-092-preparation/godot > build/release-092-preparation/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-092-preparation
          path: build/release-092-preparation/
          if-no-files-found: error
          retention-days: 7
