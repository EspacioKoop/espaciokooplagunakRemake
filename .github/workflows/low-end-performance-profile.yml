name: Low-end runtime performance profile

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: low-end-performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install graphical runtime
        run: sudo apt-get update -qq && sudo apt-get install -y xvfb libgl1-mesa-dri
      - name: Download pinned Godot editor and Linux templates
        run: python3 tools/bootstrap.py --templates --targets linux
      - name: Run real low-end build and runtime profile
        run: |
          xvfb-run -a -s '-screen 0 960x540x24' \
            python3 tools/low_end_performance_profile.py \
              --profile low-end \
              --mode graphical \
              --godot .toolchain/godot \
              --build \
              --rounds 1 \
              --samples 60 \
              --output "$RUNNER_TEMP/low-end-performance.json" \
              --markdown "$RUNNER_TEMP/low-end-performance.md"
      - name: Publish sanitized report in summary
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/low-end-performance.md"; then
            cat "$RUNNER_TEMP/low-end-performance.md" >> "$GITHUB_STEP_SUMMARY"
          else
            printf '%s\n' 'No sanitized report was produced; the runner failed before report generation.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: low-end-performance-report
          path: |
            ${{ runner.temp }}/low-end-performance.json
            ${{ runner.temp }}/low-end-performance.md
          if-no-files-found: warn
          retention-days: 14
