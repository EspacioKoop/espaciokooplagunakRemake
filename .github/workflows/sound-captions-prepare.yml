name: Verify final sound caption layout
on:
  push:
    branches: [agent/32-sound-captions-s6]
    paths: [.github/workflows/sound-captions-prepare.yml]
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'EspacioKoop/espaciokooplagunakRemake' && github.ref == 'refs/heads/agent/32-sound-captions-s6'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - name: Apply exact locally tested layout refinements
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p = Path('game/ui/sound_captions.gd')
          s = p.read_text()
          assert hashlib.sha256(s.encode()).hexdigest() == 'a11758549e357b491260101e045c1021c9d2628cda3c26d838dfc8a1b20f056b'
          pairs = [
              ('settings.size = Vector2i(590, 420)', 'settings.size = Vector2i(640, 520)'),
              ('\tvar scroll = ScrollContainer.new()\n\tscroll.set_anchors_and_offsets_preset(Control.PRESET_FULL_RECT)\n\tscroll.offset_left = 16\n\tscroll.offset_right = -16\n\tscroll.offset_top = 16\n\tscroll.offset_bottom = -56\n\tscroll.horizontal_scroll_mode = ScrollContainer.SCROLL_MODE_DISABLED\n\tsettings.add_child(scroll)', '\tvar body = VBoxContainer.new()\n\tbody.set_anchors_and_offsets_preset(Control.PRESET_FULL_RECT)\n\tbody.offset_left = 16\n\tbody.offset_right = -16\n\tbody.offset_top = 16\n\tbody.offset_bottom = -56\n\tsettings.add_child(body)\n\tvar scroll = ScrollContainer.new()\n\tscroll.size_flags_vertical = Control.SIZE_EXPAND_FILL\n\tscroll.horizontal_scroll_mode = ScrollContainer.SCROLL_MODE_DISABLED\n\tbody.add_child(scroll)'),
              ('\tcolumn.add_child(status_label)', '\t# Keep persistence errors visible even when enlarged controls need scrolling.\n\tbody.add_child(status_label)'),
          ]
          for old, new in pairs:
              assert s.count(old) == 1
              s = s.replace(old, new)
          assert hashlib.sha256(s.encode()).hexdigest() == 'd602386064bcbf5b6ed37589d540376cd4203b04ec3412ca7a6376cf7a7c8966'
          p.write_text(s)
          p = Path('tests/test_sound_captions.gd')
          s = p.read_text()
          assert hashlib.sha256(s.encode()).hexdigest() == '38c45f807b15eaf1dc5714ee0a8da782afd080a6acc9e1cb1852cf3e3ba438ce'
          old = '\tcheck(captions.status_label.text.contains("este equipo"), "local persistence acknowledged in UI")\n'
          new = old + '\tawait frames()\n\tcheck(captions.status_label.get_global_rect().end.y <= captions.settings.size.y - 55, "save status stays outside the scroll and above Close")\n\tcheck(readability.commit_text_percent(150).is_empty(), "enlarge settings to 150 percent")\n\tawait frames(8)\n\tcheck(captions.status_label.get_global_rect().end.y <= captions.settings.size.y - 55, "save status remains visible at 150 percent")\n\tcheck(readability.commit_text_percent(100).is_empty(), "restore settings text")\n'
          assert s.count(old) == 1
          s = s.replace(old, new)
          assert hashlib.sha256(s.encode()).hexdigest() == 'bac9c7fcc819bc6c033f8b8e3dfd9f1164fd5a186b206aa9a43f32f9e09277d7'
          p.write_text(s)
          PY
      - run: sudo apt-get update -qq && sudo apt-get install -y xvfb libgl1-mesa-dri
      - run: python3 tools/bootstrap.py
      - run: .toolchain/godot --headless --editor --path game --quit
      - run: python3 -m unittest discover -s tests -p test_sound_captions_runner.py -v
      - run: python3 tests/run_sound_captions.py --graphical --output build/sound-captions
      - run: python3 tests/run_readability.py
      - name: Preserve verified layout and real captures in this branch only
        run: |
          cp build/sound-captions/sound-captions.png docs/images/sound-captions.png
          cp build/sound-captions/sound-caption-settings.png docs/images/sound-caption-settings.png
          git add game/ui/sound_captions.gd tests/test_sound_captions.gd docs/images/sound-captions.png docs/images/sound-caption-settings.png
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(accessibility): keep local persistence status visible with enlarged text'
          test "$(git ls-remote origin refs/heads/agent/32-sound-captions-s6 | cut -f1)" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/agent/32-sound-captions-s6
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sound-captions-layout-evidence
          path: build/sound-captions/
          if-no-files-found: error
          retention-days: 14
