name: Integrate and photograph isolated sound captions branch
on:
  push:
    branches: [agent/32-sound-captions-s6]
    paths: [.github/workflows/sound-captions-prepare.yml]
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'EspacioKoop/espaciokooplagunakRemake' && github.ref == 'refs/heads/agent/32-sound-captions-s6'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - name: Apply only the reserved shell hooks to the exact audited blob
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p = Path('game/ui/app.gd')
          raw = p.read_bytes()
          assert hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest() == '3f562dd599f71feb6fc6ec8bc5a09cfd8995672e'
          s = raw.decode()
          pairs = [
              ('var _effects: AudioStreamPlayer\n', 'var _effects: AudioStreamPlayer\nvar _sound_captions: SoundCaptions\n'),
              ('\t_build_shell()\n\tSession.notice', '\t_build_shell()\n\t_sound_captions = SoundCaptions.new()\n\tadd_child(_sound_captions)\n\tSession.notice'),
              ('\toptions.add_child(ConsoleUI.button("Guardar partida ahora", _manual_save, true))', '\toptions.add_child(ConsoleUI.button("Subtítulos de avisos sonoros…", _sound_captions.open_settings))\n\toptions.add_child(ConsoleUI.button("Guardar partida ahora", _manual_save, true))'),
          ]
          for old, new in pairs:
              assert s.count(old) == 1
              s = s.replace(old, new)
          start = s.index('func _play_effect(')
          end = s.index('\nfunc _apply_audio', start)
          s = s[:start] + '\n'.join([
              'func _play_effect(name: String) -> void:',
              '\tvar cue = name if SoundCaptionQueue.CUES.has(name) else "confirm"',
              '\tvar path = "res://assets/audio/" + cue + ".wav"',
              '\tif not ResourceLoader.exists(path):',
              '\t\tcue = "confirm"',
              '\t\tpath = "res://assets/audio/confirm.wav"',
              '\tif _sound_captions != null: _sound_captions.present(cue)',
              '\tif _effects == null or "--test" in OS.get_cmdline_user_args(): return',
              '\t_effects.stream = load(path)',
              '\t_effects.play()',
              '',
          ]) + s[end:]
          assert hashlib.sha256(s.encode()).hexdigest() == '6ff3dbc5651ddd6884baddba3af416f292079be8c1cf6816d5d853a4637f4dca'
          p.write_text(s)
          PY
      - run: sudo apt-get update -qq && sudo apt-get install -y xvfb libgl1-mesa-dri
      - run: python3 tools/bootstrap.py
      - run: .toolchain/godot --headless --editor --path game --quit
      - run: python3 -m unittest discover -s tests -p test_sound_captions_runner.py -v
      - run: python3 tests/run_sound_captions.py --graphical --output build/sound-captions
      - run: python3 tests/run_readability.py
      - name: Preserve tested hooks and real captures; remove this temporary publisher
        run: |
          cp build/sound-captions/sound-captions.png docs/images/sound-captions.png
          cp build/sound-captions/sound-caption-settings.png docs/images/sound-caption-settings.png
          git add game/ui/app.gd docs/images/sound-captions.png docs/images/sound-caption-settings.png
          git rm .github/workflows/sound-captions-prepare.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(accessibility): connect tested sound captions to shell and preserve real captures'
          test "$(git ls-remote origin refs/heads/agent/32-sound-captions-s6 | cut -f1)" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/agent/32-sound-captions-s6
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sound-captions-integration-evidence
          path: build/sound-captions/
          if-no-files-found: error
          retention-days: 14
