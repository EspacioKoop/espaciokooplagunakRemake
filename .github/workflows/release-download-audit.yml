name: Audit published release downloads

on:
  pull_request:
    paths:
      - tools/release_download_audit.py
      - tools/publish_release.py
      - tools/export_targets.py
      - tests/test_release_download_audit.py
      - .github/workflows/release-download-audit.yml
  workflow_dispatch:
    inputs:
      tag:
        description: Published tag matching this checkout version
        required: true
        type: string
      expected_commit:
        description: Approved full commit SHA (not a moving branch)
        required: true
        type: string
      run_id:
        description: Successful canonical main push run ID
        required: true
        type: string

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -p test_release_download_audit.py -v

  published:
    if: github.event_name == 'workflow_dispatch'
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify published bytes against approved canonical CI
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
          APPROVED_COMMIT: ${{ inputs.expected_commit }}
          CANONICAL_RUN: ${{ inputs.run_id }}
        run: >-
          python3 tools/release_download_audit.py --repository "$REPOSITORY"
          --tag "$RELEASE_TAG" --expected-commit "$APPROVED_COMMIT"
          --run-id "$CANONICAL_RUN" --output release-download-audit.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: published-download-audit
          path: release-download-audit.json
          if-no-files-found: error
          retention-days: 30
