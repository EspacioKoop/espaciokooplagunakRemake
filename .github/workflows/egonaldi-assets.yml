name: Egonaldi reusable destinations

on:
  push:
    branches: [agent/56-bizigai-planets]
    paths:
      - 'art/blender/egonaldi_pack/**'
      - 'game/asset_lab/egonaldi_pack/**'
      - 'tests/egonaldi_pack/**'
      - '.github/workflows/egonaldi-assets.yml'
  pull_request:
    paths:
      - 'art/blender/egonaldi_pack/**'
      - 'art/blender/bizigai_pack/*.py'
      - 'game/assets/models/egonaldi_pack/**'
      - 'game/asset_lab/egonaldi_pack/**'
      - 'tests/egonaldi_pack/**'
      - '.github/workflows/egonaldi-assets.yml'

concurrency:
  group: egonaldi-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  destinations:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Incorporate current main only into this agent branch
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-edit origin/main
          mkdir -p build/egonaldi
          git rev-parse HEAD > build/egonaldi/tested-base.txt
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install Blender and graphical runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb xauth libgl1-mesa-dri libegl1 libxi6 libxrender1 libxfixes3 libxxf86vm1 fonts-dejavu-core
          python -m pip install 'bpy==4.5.3' 'Pillow==11.3.0'
      - name: Create and preserve six editable sources
        run: |
          set -euo pipefail
          mkdir -p build/egonaldi
          python -m compileall -q art/blender/egonaldi_pack tests/egonaldi_pack
          python -u art/blender/egonaldi_pack/author.py build 2>&1 | tee build/egonaldi/build.log
          python -u art/blender/egonaldi_pack/author.py build 2>&1 | tee build/egonaldi/preservation.log
          grep -q 'EGONALDI_SOURCES_PASS created=0 preserved=6' build/egonaldi/preservation.log
      - name: Export GLB and photograph the reimported geometry
        run: |
          set -euo pipefail
          python -u art/blender/egonaldi_pack/author.py export 2>&1 | tee build/egonaldi/export.log
      - name: Get repository-pinned verified Godot
        run: python tools/bootstrap.py
      - name: Validate destination geometry and actual walking
        run: |
          set -euo pipefail
          python tests/egonaldi_pack/run.py 2>&1 | tee build/egonaldi/validation.log
      - name: Revalidate delivered habitable planets after main integration
        run: |
          set -euo pipefail
          python tests/bizigai_pack/validate.py
          python tests/bizigai_pack/run.py
      - name: Package both libraries with standalone inspection project
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile
          root=Path.cwd();out=root/'build/egonaldi';out.mkdir(parents=True,exist_ok=True)
          paths=['art/blender/bizigai_pack','art/blender/egonaldi_pack','game/assets/models/bizigai_pack','game/assets/models/egonaldi_pack','game/asset_lab/bizigai_pack','game/asset_lab/egonaldi_pack','tests/bizigai_pack','tests/egonaldi_pack','docs/images/bizigai_pack','docs/images/egonaldi_pack']
          with zipfile.ZipFile(out/'Bizigai_Egonaldi_Biblioteca.zip','w',zipfile.ZIP_DEFLATED) as z:
              for directory in paths:
                  for p in sorted((root/directory).rglob('*')):
                      if p.is_file() and '__pycache__' not in p.parts and p.suffix not in {'.pyc','.blend1','.import','.uid'}:
                          z.write(p,p.relative_to(root))
              for name in ['docs/BIZIGAI_PLANETS.md','docs/EGONALDI_DESTINATIONS.md','docs/bizigai_assets.json','LICENSE']:
                  if (root/name).is_file():z.write(root/name,name)
              for directory in ['build/bizigai','build/egonaldi']:
                  for p in (root/directory).glob('*'):
                      if p.suffix in {'.txt','.log','.json'}:z.write(p,p.relative_to(root))
              z.writestr('game/project.godot','config_version=5\n\n[application]\nconfig/name="Bizigai + Egonaldi - Biblioteca 3D"\nrun/main_scene="res://asset_lab/egonaldi_pack/lab.tscn"\n\n[display]\nwindow/size/viewport_width=1600\nwindow/size/viewport_height=900\n\n[rendering]\nrenderer/rendering_method="gl_compatibility"\nrenderer/rendering_method.mobile="gl_compatibility"\n')
              z.writestr('LEEME.txt','Abrir game/project.godot con Godot 4.7.1. La escena inicial es Egonaldi (seis destinos recorribles). Para los dos planetas habitables, ejecutar game/asset_lab/bizigai_pack/lab.tscn con F6. Fuentes editables en art/blender. Fotos reales en docs/images. Controles en los visores y guías. No integra campaña, combate, red ni vuelo seamless. Este project.godot sólo pertenece al paquete aislado, no modifica el proyecto principal del repositorio.\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: bizigai-egonaldi-evidence
          path: |
            build/egonaldi/*.txt
            build/egonaldi/*.log
            build/egonaldi/Bizigai_Egonaldi_Biblioteca.zip
            docs/images/egonaldi_pack/*.png
          if-no-files-found: error
          retention-days: 14
      - name: Preserve validated resources on the unchanged agent branch
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/agent/56-bizigai-planets'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin agent/56-bizigai-planets
          test "$(git rev-parse origin/agent/56-bizigai-planets)" = "$GITHUB_SHA" || { echo 'Refusing stale generated resources'; exit 1; }
          git add -- art/blender/egonaldi_pack/*.blend game/assets/models/egonaldi_pack docs/images/egonaldi_pack
          python - <<'PY'
          import subprocess
          for p in subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines():
              allowed=(p.startswith('art/blender/egonaldi_pack/') and p.endswith('.blend')) or p.startswith('game/assets/models/egonaldi_pack/') or p.startswith('docs/images/egonaldi_pack/')
              if not allowed:raise SystemExit('Unexpected generated path: '+p)
          PY
          if ! git diff --cached --quiet; then
            git commit -m 'build(art): preserve six verified Egonaldi interiors and eighteen real photographs'
          fi
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/agent/56-bizigai-planets
