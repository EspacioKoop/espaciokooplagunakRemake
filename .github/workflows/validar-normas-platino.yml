name: Validar Normas Platino

on:
  push:
    paths:
      - '.platino.json'
      - 'scripts/platino.py'
      - 'tests/test_platino.py'
      - 'docs/NORMAS_PLATINO.md'
      - 'docs/normas-platino/**'
      - 'templates/**'
      - '.github/workflows/validar-normas-platino.yml'
  pull_request:
    paths:
      - '.platino.json'
      - 'scripts/platino.py'
      - 'tests/test_platino.py'
      - 'docs/NORMAS_PLATINO.md'
      - 'docs/normas-platino/**'
      - 'templates/**'
      - '.github/workflows/validar-normas-platino.yml'

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validar manifiesto sin red
        run: python3 scripts/platino.py check .platino.json
      - name: Ejecutar pruebas del validador
        run: python3 -m unittest tests/test_platino.py -v
      - name: Comprobar espacios en blanco
        run: git diff --check
