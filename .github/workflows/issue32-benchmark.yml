name: Issue 32 benchmark evidence
on:
  push:
    paths: ["tools/issue32_benchmark.py","tests/test_issue32_benchmark.py","docs/ISSUE32_BENCHMARK.md",".github/workflows/issue32-benchmark.yml"]
  pull_request:
    paths: ["tools/issue32_benchmark.py","tests/test_issue32_benchmark.py","docs/ISSUE32_BENCHMARK.md",".github/workflows/issue32-benchmark.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: "3.11"}
      - name: Run real contracts and reject empty discovery
        run: >-
          python -c 'import sys, unittest;
          suite = unittest.defaultTestLoader.discover("tests", pattern="test_issue32_benchmark.py");
          count = suite.countTestCases();
          print(f"Discovered {count} benchmark tests", flush=True);
          sys.exit(5 if count == 0 else (0 if unittest.TextTestRunner(verbosity=2).run(suite).wasSuccessful() else 1))'
      - name: Produce synthetic evidence, without FPS claims
        run: python tools/issue32_benchmark.py --profile all --rounds 1 --json issue32-benchmark.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: issue32-benchmark-evidence
          path: issue32-benchmark.json
          if-no-files-found: error
          retention-days: 14
