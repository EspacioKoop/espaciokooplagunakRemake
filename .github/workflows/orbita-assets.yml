name: Orbita Blender library

on:
  push:
    branches: [agent/52-orbita-library]
    paths:
      - 'art/blender/orbita_pack/**'
      - 'game/asset_lab/orbita_pack/**'
      - 'tests/orbita_pack/**'
      - '.github/workflows/orbita-assets.yml'
  pull_request:
    paths:
      - 'art/blender/orbita_pack/**'
      - 'game/assets/models/orbita_pack/**'
      - 'game/asset_lab/orbita_pack/**'
      - 'tests/orbita_pack/**'
      - '.github/workflows/orbita-assets.yml'
  workflow_dispatch:

concurrency:
  group: orbita-assets-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  orbita:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install Blender module and display runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb xauth libgl1-mesa-dri libegl1 libxi6 libxrender1 libxfixes3 libxxf86vm1 fonts-dejavu-core
          python -m pip install 'bpy==4.5.3' 'Pillow==11.3.0'
      - name: Syntax and constructor checks
        run: |
          python -m compileall -q art/blender/orbita_pack tests/orbita_pack
          mkdir -p build/orbita
          python -u art/blender/orbita_pack/build.py --missing-only 2>&1 | tee build/orbita/build.log
      - name: Export editable models and render previews
        run: python -u art/blender/orbita_pack/export.py --render 2>&1 | tee build/orbita/export.log
      - name: Verify geometry, hashes, materials, sockets and negative cases
        run: python tests/orbita_pack/validate.py 2>&1 | tee build/orbita/validate.log
      - name: Download repository-pinned verified Godot
        run: python tools/bootstrap.py
      - name: Import and inspect every asset in real Godot
        run: python tests/orbita_pack/run.py
      - name: Package sources, models and evidence
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile
          root=Path.cwd(); out=root/'build/orbita'; out.mkdir(parents=True,exist_ok=True)
          with zipfile.ZipFile(out/'Orbita_Biblioteca_3D.zip','w',zipfile.ZIP_DEFLATED) as z:
              for directory in ['art/blender/orbita_pack','game/assets/models/orbita_pack','game/asset_lab/orbita_pack','docs/images/orbita_pack','tests/orbita_pack']:
                  for p in sorted((root/directory).rglob('*')):
                      if p.is_file() and '__pycache__' not in p.parts and p.suffix not in {'.pyc','.blend1'}:
                          z.write(p,p.relative_to(root))
              for name in ['docs/ORBITA_ASSET_PACK.md','docs/ASSET_LIBRARY.md','docs/asset_library.json','LICENSE']:
                  p=root/name
                  if p.is_file(): z.write(p,name)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: orbita-library-evidence
          path: |
            build/orbita/*.log
            build/orbita/*.json
            build/orbita/*.png
            build/orbita/Orbita_Biblioteca_3D.zip
            docs/images/orbita_pack/overview.png
          if-no-files-found: error
          retention-days: 14
      - name: Publish generated assets only to this agent branch
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/agent/52-orbita-library'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin agent/52-orbita-library
          git merge --ff-only origin/agent/52-orbita-library
          git add -- art/blender/orbita_pack/*.blend game/assets/models/orbita_pack docs/images/orbita_pack docs/ORBITA_ASSET_PACK.md
          if git diff --cached --quiet; then exit 0; fi
          python - <<'PY'
          import subprocess
          paths=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          for p in paths:
              allowed=(p.startswith('art/blender/orbita_pack/') and p.endswith('.blend')) or p.startswith('game/assets/models/orbita_pack/') or p.startswith('docs/images/orbita_pack/') or p=='docs/ORBITA_ASSET_PACK.md'
              if not allowed: raise SystemExit('Refusing unexpected publication path: '+p)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build(art): publish validated Orbita Blender sources, GLB and renders'
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/agent/52-orbita-library
