name: Verify authored campaigns

on:
  pull_request:
  push:
    branches: [main, agent/2-campaign-editor]

permissions:
  contents: read

jobs:
  campaign-editor:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download verified Godot
        run: python3 tools/bootstrap.py
      - name: Import resources and reject script diagnostics
        run: |
          python3 - <<'PY'
          import re
          import subprocess
          result = subprocess.run(['.toolchain/godot', '--headless', '--editor', '--path', 'game', '--quit'], text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, timeout=180)
          print(result.stdout)
          if result.returncode or re.search(r'^(SCRIPT ERROR|ERROR):', result.stdout, re.MULTILINE):
              raise SystemExit(1)
          PY
      - name: Exercise documents, authority, saves and actual UI
        run: python3 tests/run_campaign_editor.py
