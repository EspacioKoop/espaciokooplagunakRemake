name: Verify and package standalone

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: standalone-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install display runtime
        run: sudo apt-get update -qq && sudo apt-get install -y xvfb libgl1-mesa-dri
      - name: Validate release package publishing
        run: python3 -m unittest discover -s tests -p test_publish_release.py
      - name: Verify locale coverage gate
        run: python3 tools/check_locale_coverage.py --require-complete
      - name: Verify parity evidence registry
        run: python3 tools/check_parity_evidence.py
      - name: Download verified Godot toolchain
        run: python3 tools/bootstrap.py --templates
      - name: Import resources
        run: .toolchain/godot --headless --editor --path game --quit
      - name: Verify issue 32 closeout feature runners
        run: |
          python3 tests/test_scenario_corpus.py
          python3 tests/run_cosmography_navigation.py
          python3 tests/run_cosmography_persistence.py
          python3 tests/run_cosmography_service.py
          python3 tests/run_readability.py
          python3 tests/run_gm_interior_trigger.py
          python3 tests/run_npc_workbench.py
          python3 tests/run_foundry_authority.py
      - name: Verify exported acceptance runner negative controls
        run: |
          python3 tests/release_092/prepare.py --check
          python3 -m unittest discover -s tests/release_092 -p test_runner.py -v
      - name: Verify embedded acceptance dispatch and inactive normal startup
        run: python3 -m unittest discover -s tests/release_092 -p test_dispatch.py -v
      - name: Complete campaign and validate saves
        run: .toolchain/godot --headless --path game --script ../tests/test_core.gd -- --test
      - name: Verify native station operations and skill assistance
        run: |
          .toolchain/godot --headless --path game --script ../tests/test_operations.gd -- --test
          .toolchain/godot --headless --path game --script ../tests/test_cooperation.gd -- --test
          .toolchain/godot --headless --path game --script ../tests/test_ship_physics.gd -- --test
      - name: Verify four shield quadrants and dynamic collisions
        run: .toolchain/godot --headless --path game --script ../tests/test_ship_quadrants_collisions.gd -- --test
      - name: Verify modular mounts turrets arcs and automatic fire
        run: .toolchain/godot --headless --path game --script ../tests/test_armaments.gd -- --test
      - name: Verify sustained lateral maneuvering and stabilization
        run: .toolchain/godot --headless --path game --script ../tests/test_continuous_maneuvering.gd -- --test
      - name: Verify atlas factions crew trade and game direction
        run: .toolchain/godot --headless --path game --script ../tests/test_expedition.gd -- --test
      - name: Verify short long range sensors probe analysis and hacking
        run: .toolchain/godot --headless --path game --script ../tests/test_advanced_sensors.gd -- --test
      - name: Verify crew skills traits focus progression and abilities
        run: .toolchain/godot --headless --path game --script ../tests/test_crew.gd -- --test
      - name: Verify tactical ground combat initiative cover weapons and AI
        run: .toolchain/godot --headless --path game --script ../tests/test_ground_combat.gd -- --test
      - name: Verify faction fleet AI patrol escort intercept morale and convoy orders
        run: .toolchain/godot --headless --path game --script ../tests/test_fleet_ai.gd -- --test
      - name: Exercise five actual network processes
        run: python3 tests/run_network.py
      - name: Verify actual HTTP boundary
        run: python3 tests/run_telemetry.py
      - name: Exercise native UI and room collisions
        run: timeout 60 .toolchain/godot --headless --path game --script ../tests/test_ui.gd -- --test
      - name: Walk through museum, beach and social spaces
        run: |
          timeout 60 .toolchain/godot --headless --path game --script ../tests/test_leisure.gd -- --test
          timeout 60 .toolchain/godot --headless --path game --script ../tests/test_full_deck_walk.gd -- --test
          .toolchain/godot --headless --path game --script ../tests/test_gm_integration.gd -- --test
          python3 tests/run_interior_triggers.py
          .toolchain/godot --headless --path game --script ../tests/test_accessibility.gd -- --test
      - name: Play authoritative social tables and test reconnection
        run: |
          timeout 90 .toolchain/godot --headless --path game --script ../tests/test_tables.gd -- --test
          python3 tests/run_table_network.py
      - name: Test optional Foundry client
        run: node --test integrations/foundry/tests/client.test.mjs
      - name: Export both standalone applications
        run: python3 tools/build.py
      - name: Capture the exported Linux game
        run: python3 tools/capture.py --binary "$PWD/build/linux/EspaciokoopLagunak.x86_64" --output docs/images
      - name: Package downloads and validate all artifacts
        run: |
          python3 tools/package_downloads.py
          python3 tools/verify_artifacts.py
          cp docs/RELEASE_NOTES.md dist/RELEASE_NOTES.md
      - name: Verify the actual Linux download and terminal interactions
        run: python3 tests/release_092/run.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: exported-release-acceptance
          path: build/release-092/
          if-no-files-found: warn
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: standalone-downloads
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  windows-smoke:
    needs: build
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: standalone-downloads
          path: dist
      - name: Start the exported Windows application
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem dist/EspaciokoopLagunak-*-windows-x86_64.zip)
          if ($packages.Count -ne 1) { throw "Expected exactly one Windows package" }
          Expand-Archive $packages[0].FullName -DestinationPath game
          $application = (Resolve-Path game/EspaciokoopLagunak.exe).Path
          $result = Start-Process -FilePath $application -ArgumentList '--headless','--audio-driver','Dummy','--quit-after','60','--','--test' -Wait -PassThru -RedirectStandardOutput stdout.txt -RedirectStandardError stderr.txt
          Get-Content stdout.txt,stderr.txt
          if ($result.ExitCode -ne 0) { throw "Application exited with $($result.ExitCode)" }
          if (Select-String -Path stdout.txt,stderr.txt -Pattern '^(SCRIPT ERROR|ERROR):') { throw 'Godot reported an error' }
